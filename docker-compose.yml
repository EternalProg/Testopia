name: testopia

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: testopia
      MYSQL_USER: testopia
      MYSQL_PASSWORD: testopia
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: mysql://testopia:testopia@mysql:3306/testopia
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      # Trust X-Forwarded-For for client IPs (rate limiting, logs). The
      # bundled nginx proxies every /api/* request and overwrites
      # X-Forwarded-For with the real client IP, so trusting it is safe
      # through that ingress. If you publish the backend port beyond the
      # proxy (or remove nginx), set TRUST_PROXY=0: with trust-all, headers
      # from direct clients would be honored verbatim.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
